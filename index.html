    <style>
        :root {
            --bg:        #F5F0E8;
            --surface:   #FDFAF5;
            --border:    #DDD5C4;
            --text:      #3D2B1F;
            --muted:     #9B8B79;
            --accent:    #C4714A;
            --accent2:   #7A8C6E;
            --header-bg: #FDFAF5;
            --card-bg:   #FDFAF5;
            --shadow:    rgba(61,43,31,0.10);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        img { max-width: 100%; }
        button, input, select { font: inherit; color: inherit; }
        input[type="search"] { -webkit-appearance: none; appearance: none; }
        .card-price.tanya { font-size: 0.8rem; color: var(--accent); }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            padding-bottom: 5rem;
            position: relative;
        }

        /* Subtle grain texture */
        body::before {
            content: '';
            position: fixed; inset: 0;
            pointer-events: none; z-index: 0; opacity: 0.035;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-size: 180px;
        }

        main, header { position: relative; z-index: 1; }

        /* ── HEADER ── */
        header {
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 50;
        }
        .header-inner { padding: 0.85rem 1rem 0.75rem; }
        .brand-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.65rem; }
        .brand-tagline {
            font-size: 0.62rem; letter-spacing: 0.1em;
            color: var(--muted); text-transform: uppercase; margin-top: 0.15rem;
            line-height: 1.4;
        }
        @media (min-width: 900px) {
            .brand-tagline { white-space: nowrap; letter-spacing: 0.12em; }
        }
        .ig-btn {
            width: 2.2rem; height: 2.2rem; border-radius: 50%;
            border: 1.5px solid var(--border); background: var(--surface);
            display: flex; align-items: center; justify-content: center;
            color: var(--muted); transition: border-color 0.2s, color 0.2s; flex-shrink: 0;
            text-decoration: none;
        }
        .ig-btn:hover { border-color: #E1306C; color: #E1306C; }

        .search-wrap { position: relative; margin-bottom: 0; }
        .search-wrap input {
            width: 100%; padding: 0.58rem 1rem 0.58rem 2.4rem;
            border-radius: 999px; border: 1.5px solid var(--border);
            background: var(--bg); color: var(--text);
            font-family: 'DM Sans', sans-serif; font-size: 0.8rem;
            outline: none; transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-wrap input::placeholder { color: var(--muted); }
        .search-wrap input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(196,113,74,0.12); }
        .search-wrap select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(196,113,74,0.12); outline: none; }
        .search-icon {
            position: absolute; left: 0.8rem; top: 50%; transform: translateY(-50%);
            color: var(--muted); width: 0.9rem; height: 0.9rem; pointer-events: none;
        }

        .filter-bar {
            display: flex; gap: 0.45rem;
            overflow-x: auto; padding: 0.65rem 1rem 0.75rem;
            scrollbar-width: none;
        }
        .filter-bar::-webkit-scrollbar { display: none; }

        .filter-btn {
            white-space: nowrap; padding: 0.3rem 1rem;
            border-radius: 999px; border: 1.5px solid var(--border);
            background: var(--surface); color: var(--muted);
            font-family: 'DM Sans', sans-serif; font-size: 0.68rem;
            font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
            cursor: pointer; transition: all 0.2s; flex-shrink: 0;
        }
        .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
        .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

        /* ── GRID ── */
        .katalog-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.8rem; padding: 1rem;
            max-width: 1400px; margin: 0 auto;
        }
        @media (min-width: 600px)  { .katalog-grid { grid-template-columns: repeat(3,1fr); } }
        @media (min-width: 900px)  { .katalog-grid { grid-template-columns: repeat(4,1fr); gap: 1rem; padding: 1.25rem; } }
        @media (min-width: 1280px) { .katalog-grid { grid-template-columns: repeat(5,1fr); } }

        /* Mobile: header controls stacked */
        .header-desktop { display: block; }
        .brand-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.65rem; }
        .header-controls { display: contents; }
        .search-row { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
        .search-row .search-wrap { flex: 1; }

        /* ── DESKTOP HEADER ── */
        @media (min-width: 900px) {
            .header-inner { padding: 0.85rem 1.5rem; }

            /* Satu baris: [brand] [controls] */
            .header-desktop {
                display: flex;
                align-items: center;
                gap: 1.25rem;
            }

            /* Brand kiri — lebar tetap */
            .brand-row {
                flex-shrink: 0;
                margin-bottom: 0;
                align-items: center;
                gap: 0.75rem;
            }

            /* Controls mengisi sisa ruang */
            .header-controls {
                display: flex;
                flex: 1;
                align-items: center;
                gap: 0.5rem;
            }

            /* Search motif lebih lebar */
            .header-controls > .search-wrap {
                flex: 2;
                margin-top: 0 !important;
            }

            /* Baris ukuran + sort sejajar dengan search */
            .search-row {
                flex: 1.2;
                display: flex;
                gap: 0.5rem;
                margin-top: 0;
            }
            .search-row .search-wrap {
                flex: 1;
                margin-top: 0 !important;
            }

            /* Semua input/select sama tingginya */
            .header-controls input,
            .header-controls select {
                height: 2.4rem;
                padding-top: 0 !important;
                padding-bottom: 0 !important;
                display: flex;
                align-items: center;
            }
        }

        /* ── CARD ── */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 1rem; overflow: hidden;
            display: flex; flex-direction: column;
            box-shadow: 0 2px 8px var(--shadow);
            transition: transform 0.22s ease, box-shadow 0.22s ease;
            contain: layout style;
        }
        .card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px var(--shadow); }

        .card-img-wrap {
            position: relative; aspect-ratio: 3/4; overflow: hidden;
            background-color: #E8E0D0;
        }
        .card-img-wrap img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; display: block; }

        .ukuran-overlay {
            display: flex; flex-wrap: wrap; gap: 0.28rem;
            margin-bottom: 0.45rem;
        }
        .ukuran-label {
            font-size: 0.58rem; font-weight: 700; color: var(--muted);
            text-transform: uppercase; letter-spacing: 0.08em;
            margin-bottom: 0.28rem;
            display: flex; align-items: center; gap: 0.35rem;
        }
        .ukuran-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
        .ukuran-btn {
            font-size: 0.6rem; padding: 0.25rem 0.55rem; border-radius: 0.35rem;
            background: var(--bg); border: 1.5px solid var(--border);
            color: var(--text); font-weight: 700; font-family: 'DM Sans', sans-serif;
            cursor: pointer; transition: all 0.15s; letter-spacing: 0.02em;
        }
        .ukuran-btn:hover:not(.selected) { border-color: var(--accent); color: var(--accent); }        .ukuran-btn.selected { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 1px 4px rgba(196,113,74,0.35); }

        .card-body { padding: 0.6rem 0.7rem 0.7rem; display: flex; flex-direction: column; flex: 1; }
        .card-koleksi {
            font-size: 0.58rem; font-weight: 700; letter-spacing: 0.12em;
            text-transform: uppercase; color: var(--accent); margin-bottom: 0.12rem;
        }
        .card-nama {
            font-family: 'Lora', serif; font-size: 0.78rem; font-weight: 600;
            line-height: 1.3;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden; margin-bottom: 0.4rem; color: var(--text);
        }
        .card-footer {
            margin-top: auto; padding-top: 0.45rem;
            border-top: 1px solid var(--border);
        }
        .card-footer-price { margin-bottom: 0.4rem; }
        .card-footer-actions { display: flex; align-items: center; justify-content: space-between; gap: 0.4rem; }
        .card-price-wrap { display: flex; flex-direction: column; gap: 0.02rem; }
        .card-price-label { font-size: 0.54rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
        .card-price { font-family: 'Lora', serif; font-size: 0.9rem; font-weight: 600; color: var(--text); font-style: italic; line-height: 1.15; white-space: nowrap; }
        .card-stok  { font-size: 0.58rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
        .stok-ada   { color: var(--accent2); }
        .stok-habis { color: #e05252; }

        .wa-btn {
            width: 1.9rem; height: 1.9rem; border-radius: 0.5rem;
            background: var(--surface); border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; transition: transform 0.15s, box-shadow 0.15s; text-decoration: none;
        }
        .wa-btn:hover { transform: scale(1.12); box-shadow: 0 2px 8px var(--shadow); }

        /* Share button */
        .share-btn {
            width: 1.9rem; height: 1.9rem; border-radius: 0.5rem;
            background: var(--surface); border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; transition: transform 0.15s, box-shadow 0.15s;
            cursor: pointer; color: var(--muted);
        }
        .share-btn:hover { transform: scale(1.12); box-shadow: 0 2px 8px var(--shadow); color: var(--accent); border-color: var(--accent); }

        /* Stok habis overlay */
        .stok-habis-overlay {
            position: absolute; inset: 0;
            background: rgba(245,240,232,0.72);
            display: flex; align-items: center; justify-content: center;
            pointer-events: none;
        }
        .stok-habis-badge {
            background: #e05252; color: #fff;
            font-family: 'DM Sans', sans-serif; font-size: 0.62rem; font-weight: 700;
            letter-spacing: 0.1em; text-transform: uppercase;
            padding: 0.3rem 0.8rem; border-radius: 999px;
            box-shadow: 0 2px 8px rgba(224,82,82,0.3);
        }

        /* ── SKELETON ── */
        .skeleton {
            background: linear-gradient(90deg, var(--border) 25%, #f0ece4 50%, var(--border) 75%);
            background-size: 200% 100%; animation: shimmer 1.6s infinite;
        }
        @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

        /* ── LAZY IMG ── */
        .lazy-img { opacity: 0; transition: opacity 0.3s ease; will-change: opacity; }
        .lazy-img.loaded { opacity: 1; will-change: auto; }

        /* ── MODAL ── */
        #modal-zoom {
            display: none; position: fixed; inset: 0;
            background: rgba(20,12,6,0.96); z-index: 100;
            align-items: center; justify-content: center;
            cursor: default;
        }
        #modal-zoom .modal-backdrop {
            position: absolute; inset: 0; cursor: zoom-out;
        }
        #modal-zoom .modal-content {
            position: relative; z-index: 1;
            display: flex; align-items: center; justify-content: center;
        }
        #img-zoom {
            max-width: 92vw; max-height: 88vh;
            object-fit: contain; border-radius: 0.75rem;
            cursor: default; display: block;
        }
        #modal-close-btn {
            position: fixed; top: 1rem; right: 1rem;
            width: 2.4rem; height: 2.4rem; border-radius: 50%;
            background: rgba(253,250,245,0.15); border: 1.5px solid rgba(253,250,245,0.3);
            color: #fff; display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 2;
            transition: background 0.2s, transform 0.2s;
            backdrop-filter: blur(4px);
        }
        #modal-close-btn:hover { background: rgba(253,250,245,0.25); transform: scale(1.1); }

        .ornament { text-align: center; color: var(--accent); font-size: 1rem; letter-spacing: 0.4em; margin: 0.25rem 0 0; opacity: 0.4; }
        #status-text { text-align: center; color: var(--muted); font-size: 0.7rem; margin: 0.3rem 0 0.5rem; }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <!-- Mobile: stacked, Desktop: horizontal via CSS -->
            <div class="header-desktop">
                <div class="brand-row">
                    <div>
                        <img src="https://i.ibb.co.com/Gv2LpsVy/Aneka-Karpet-Indah-logo-page-0001.jpg"
                             alt="Aneka Karpet Indah"
                             style="height:2.5rem;width:auto;object-fit:contain;display:block"
                             fetchpriority="high" decoding="async">
                        <p class="brand-tagline">Katalog Permadani - CV. Aneka Karpet Indah</p>
                    </div>
                    <a href="https://www.instagram.com/anekakarpetjogja/" target="_blank" rel="noopener noreferrer"
                       class="ig-btn" aria-label="Instagram Aneka Karpet Indah" style="margin-left:0.75rem">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>

                </div>
                <div class="header-controls">
                    <!-- Search bar -->
                    <div class="search-wrap" style="flex:1.5">
                        <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                        </svg>
                        <input type="search" id="search-input" placeholder="Cari merk atau motif..."
                               autocomplete="off" autocorrect="off" spellcheck="false">
                    </div>
                    <!-- Ukuran + Sort -->
                    <div class="search-row">
                        <div class="search-wrap" style="flex:1">
                            <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width:0.85rem;height:0.85rem">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16M4 16h16"/>
                            </svg>
                            <select id="ukuran-select" onchange="filterUkuran()"
                                    style="appearance:none;-webkit-appearance:none;width:100%;padding:0.58rem 2rem 0.58rem 2.4rem;border-radius:999px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.8rem;outline:none;transition:border-color 0.2s,box-shadow 0.2s;cursor:pointer">
                                <option value="">Semua Ukuran</option>
                            </select>
                            <svg style="position:absolute;right:0.85rem;top:50%;transform:translateY(-50%);width:0.8rem;height:0.8rem;color:var(--muted);pointer-events:none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                            </svg>
                        </div>
                        <div class="search-wrap" style="flex:1">
                            <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width:0.85rem;height:0.85rem">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 6h18M6 12h12M9 18h6"/>
                            </svg>
                            <select id="sort-select" onchange="sortProduk()"
                                    style="appearance:none;-webkit-appearance:none;width:100%;padding:0.58rem 2rem 0.58rem 2.4rem;border-radius:999px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.8rem;outline:none;transition:border-color 0.2s,box-shadow 0.2s;cursor:pointer">
                                <option value="">Urutkan</option>
                                <option value="asc">Harga Termurah</option>
                                <option value="desc">Harga Termahal</option>
                            </select>
                            <svg style="position:absolute;right:0.85rem;top:50%;transform:translateY(-50%);width:0.8rem;height:0.8rem;color:var(--muted);pointer-events:none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>

                </div>
            </div>
        </div>
        <div class="filter-bar" id="filter-bar">
            <button class="filter-btn active">SEMUA</button>
        </div>

            <div class="card"><div class="card-img-wrap skeleton" style="aspect-ratio:3/4"></div><div class="card-body" style="gap:0.4rem"><div class="skeleton" style="height:0.5rem;width:40%;border-radius:4px"></div><div class="skeleton" style="height:0.75rem;width:90%;border-radius:4px"></div><div class="skeleton" style="height:0.75rem;width:65%;border-radius:4px"></div><div class="skeleton" style="height:1rem;width:55%;border-radius:4px;margin-top:0.4rem"></div></div></div>

        <p class="ornament" id="ornament" style="display:none">— ✦ —</p>

        </button>

            <img id="img-zoom" src="" alt="Zoom produk" decoding="async">
        </div>

    <script>
        const SHEET_ID  = '1iLJWtfJntcjZalA7q-FFIUNe8BXGT40za7kMeELXfJk';
        const WA_NUMBER = '6287881807772';
        // headers=0 → baris 1 di sheet selalu dibaca sebagai produk (sheet tidak memakai baris judul)
        const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&headers=0`;
        const CACHE_KEY = 'aki_katalog_v4';
        const CACHE_SEGAR = 1 * 60 * 1000; // data di bawah 1 menit tidak diambil ulang
        const FOTO_ERROR = 'https://placehold.co/400x500/e8e0d0/9b8b79?text=Foto+Error';
        const PER_HALAMAN = 24;

        let semuaProduk = [], lazyObserver = null;
        let dataTampil = [];   // data yang sedang aktif (hasil filter/search/sort)
        let halamanSaat = 0;   // jumlah batch yang sudah ditampilkan

        const WA_ICON = `<svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 48 48"><path fill="#25D366" d="M4.9 43.3l2.7-9.9C5.9 30.6 5 27.4 5 24 5 13.5 13.5 5 24 5s19 8.5 19 19-8.5 19-19 19c-3.2 0-6.2-.8-8.8-2.3L4.9 43.3z"/><path fill="#fff" d="M33.7 28.3c-.4-.2-2.3-1.1-2.6-1.3-.3-.1-.6-.2-.9.2-.3.4-1 1.3-1.3 1.5-.2.3-.5.3-.9.1-.4-.2-1.7-.6-3.2-2-1.2-1-2-2.3-2.2-2.7-.2-.4 0-.6.2-.8.2-.2.4-.5.6-.7.2-.2.2-.4.3-.7.1-.2 0-.5-.1-.7-.1-.2-1-2.3-1.3-3.1-.3-.8-.7-.7-1-.7h-.8c-.3 0-.7.1-1 .5s-1.4 1.4-1.4 3.3 1.4 3.8 1.6 4.1c.2.3 2.8 4.3 6.8 6 .9.4 1.7.6 2.2.8.9.3 1.8.2 2.4.1.7-.1 2.3-.9 2.6-1.8.3-.9.3-1.6.2-1.8-.1-.2-.4-.3-.8-.5z"/></svg>`;

        /* ───────── Helper ───────── */

        function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

        // Amankan teks dari sheet sebelum dimasukkan ke HTML (tanda kutip, <, & dll)
        function esc(s) {
            return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
        }

        // Rapikan spasi: "  Almaya  " → "Almaya"
        function rapikan(s) { return String(s ?? '').replace(/\s+/g, ' ').trim(); }

        // Samakan format ukuran: "160x210", "160 X 210", "160 × 210" → "160 x 210"
        function rapikanUkuran(s) {
            const t = rapikan(s);
            const m = t.match(/^(\d+(?:[.,]\d+)?)\s*[x×X*]\s*(\d+(?:[.,]\d+)?)/);
            return m ? `${m[1]} x ${m[2]}` : (t || '-');
        }

        function luasUkuran(u) {
            const m = String(u).match(/^(\d+(?:[.,]\d+)?) x (\d+(?:[.,]\d+)?)/);
            return m ? parseFloat(m[1].replace(',', '.')) * parseFloat(m[2].replace(',', '.')) : Infinity;
        }

        // Angka dari sel sheet; sel kosong / teks aneh → 0
        function angka(v) {
            if (typeof v === 'number' && isFinite(v)) return v;
            const n = parseInt(String(v ?? '').replace(/[^\d]/g, ''), 10);
            return isNaN(n) ? 0 : n;
        }

        function teksHarga(h) { return h > 0 ? 'Rp ' + h.toLocaleString('id-ID') : 'Hubungi kami'; }

        // Foto Cloudinary: minta versi yang sudah diperkecil & dikompres otomatis
        function fotoCloudinary(url, lebar) {
            if (!url || !url.includes('res.cloudinary.com') || !url.includes('/image/upload/')) return url;
            return url.replace(/\/image\/upload\/((?:[a-z]{1,3}_[^/]+\/)*)/, `/image/upload/f_auto,q_auto,w_${lebar},c_limit/`);
        }
        const fotoKecil = url => fotoCloudinary(url, 500);
        const fotoBesar = url => fotoCloudinary(url, 1600);

        /* ───────── Ambil & olah data ───────── */

        function bacaCache() {
            try { return JSON.parse(localStorage.getItem(CACHE_KEY)); } catch (_) { return null; }
        }
        function simpanCache(data) {
            try { localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), data })); } catch (_) {}
        }

        async function ambilDariSheet() {
            const res = await fetch(SHEET_URL, { cache: 'no-store' });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const txt = await res.text();
            const json = JSON.parse(txt.slice(txt.indexOf('(') + 1, txt.lastIndexOf(')')));
            return olahBaris(json.table.rows);
        }

        function olahBaris(rows) {
            const grup = {}, namaKoleksi = {};
            let uid = 0;

            rows.forEach(row => {
                const sel = i => (row.c && row.c[i] && row.c[i].v != null) ? row.c[i].v : null;
                const koleksiRaw = rapikan(sel(0));
                if (!koleksiRaw) return; // baris kosong

                // Nama koleksi pakai penulisan yang pertama muncul ("Almaya" & "almaya" jadi satu)
                const kKey = koleksiRaw.toLowerCase();
                const koleksi = namaKoleksi[kKey] || (namaKoleksi[kKey] = koleksiRaw);

                const namaRaw = rapikan(sel(1));
                const ukuran  = rapikanUkuran(sel(2));
                const harga   = angka(sel(3));
                const stok    = angka(sel(4));
                const foto    = rapikan(sel(5));

                const standalone = !namaRaw || namaRaw === '-' || namaRaw.toLowerCase() === 'motif baru';
                const id = standalone ? `standalone-${uid++}` : `${kKey}|${namaRaw.toLowerCase()}`;
                if (!grup[id]) grup[id] = { koleksi, nama: namaRaw || 'Motif Baru', fotoUtama: '', variasi: [] };
                const g = grup[id];
                if (!g.fotoUtama && foto && foto !== '-') g.fotoUtama = foto;
                const fotoFinal = (foto && foto !== '-') ? foto : g.fotoUtama;

                // Deduplikasi: ukuran sama dalam satu produk → pakai baris paling bawah
                const v = { ukuran, harga, stok, foto: fotoFinal };
                const idx = g.variasi.findIndex(x => x.ukuran === ukuran);
                if (idx >= 0) g.variasi[idx] = v; else g.variasi.push(v);
            });

            const hasil = Object.values(grup);
            hasil.forEach(p => {
                p.variasi.forEach(v => { if (!v.foto) v.foto = p.fotoUtama; });
                p.variasi.sort((a, b) => luasUkuran(a.ukuran) - luasUkuran(b.ukuran));
            });
            return hasil;
        }

        // Tampilkan data tersimpan dulu (instan), lalu perbarui diam-diam dari sheet
        async function ambilData() {
            const cache = bacaCache();
            const adaCache = cache && Array.isArray(cache.data) && cache.data.length;

            if (adaCache) {
                semuaProduk = cache.data;
                siapkanHalaman();
                if (Date.now() - cache.ts < CACHE_SEGAR) return;
            }

            try {
                const baru = await ambilDariSheet();
                const berubah = !adaCache || JSON.stringify(baru) !== JSON.stringify(cache.data);
                simpanCache(baru);
                if (!berubah) return;
                semuaProduk = baru;
                if (adaCache) perbaruiDiam(); else siapkanHalaman();
            } catch (err) {
                if (!adaCache) {
                    document.getElementById('katalog-container').innerHTML =
                        `<p style="grid-column:1/-1;text-align:center;padding:4rem 1rem;color:var(--muted);font-style:italic">Gagal memuat data. Coba refresh halaman.</p>`;
                }
                // Kalau ada data tersimpan, katalog tetap tampil walau sheet gagal diakses
            }
        }

        function siapkanHalaman() {
            buatTombolFilter();
            bacaURLParam();
        }

        // Data baru datang saat customer sudah melihat katalog: pertahankan filter & jumlah produk yang sudah dimuat
        function perbaruiDiam() {
            const koleksiAktif = getKoleksiAktif();
            const ukuranAktif  = document.getElementById('ukuran-select').value;
            const halaman      = Math.max(1, halamanSaat);
            buatTombolFilter();
            setKoleksiAktif(koleksiAktif);
            const sel = document.getElementById('ukuran-select');
            sel.value = [...sel.options].some(o => o.value === ukuranAktif) ? ukuranAktif : '';
            terapkanFilter({ halaman, scroll: false });
        }

        /* ───────── Filter, sort, URL ───────── */

        function getKoleksiAktif() {
            const btn = document.querySelector('.filter-btn.active');
            return btn ? (btn.dataset.koleksi || '') : '';
        }
        function setKoleksiAktif(koleksi) {
            let cocok = false;
            document.querySelectorAll('.filter-btn').forEach(b => {
                const aktif = (b.dataset.koleksi || '').toLowerCase() === (koleksi || '').toLowerCase();
                b.classList.toggle('active', aktif);
                if (aktif) cocok = true;
            });
            if (!cocok) document.querySelector('.filter-btn').classList.add('active');
        }

        function cocokKeyword(p, keyword) {
            if (!keyword) return true;
            return (p.koleksi + ' ' + p.nama).toLowerCase().includes(keyword);
        }

        function getFilteredData() {
            const keyword = rapikan(document.getElementById('search-input').value).toLowerCase();
            const ukuran  = document.getElementById('ukuran-select').value;
            const koleksi = getKoleksiAktif();
            return semuaProduk.filter(p =>
                (!koleksi || p.koleksi === koleksi) &&
                cocokKeyword(p, keyword) &&
                (!ukuran || p.variasi.some(v => v.ukuran === ukuran))
            );
        }

        // Harga yang dipakai untuk urutan: ukuran terpilih (kalau ada filter), selain itu harga termurah yang masih ada stok
        function hargaUntukUrut(p, ukuran) {
            let pilihan = ukuran ? p.variasi.filter(v => v.ukuran === ukuran) : p.variasi.filter(v => v.stok > 0);
            if (!pilihan.length) pilihan = p.variasi;
            const harga = pilihan.map(v => v.harga).filter(h => h > 0);
            return harga.length ? Math.min(...harga) : null;
        }

        function urutkan(data) {
            const arah = document.getElementById('sort-select').value;
            if (!arah) return data;
            const ukuran = document.getElementById('ukuran-select').value;
            return [...data].sort((a, b) => {
                const hA = hargaUntukUrut(a, ukuran), hB = hargaUntukUrut(b, ukuran);
                if (hA === null) return 1;   // harga kosong selalu di bawah
                if (hB === null) return -1;
                return arah === 'asc' ? hA - hB : hB - hA;
            });
        }

        // Satu pintu untuk semua perubahan filter → urutan harga tidak pernah hilang
        function terapkanFilter({ halaman = 1, scroll = false } = {}) {
            const hasil = urutkan(getFilteredData());
            tampilkanKatalog(hasil, halaman);
            setStatus(buatPesanStatus(hasil.length));
            perbaruiURL();
            if (scroll) setTimeout(() => document.getElementById('search-input').scrollIntoView({ behavior: 'smooth', block: 'start' }), 400);
        }

        function buatPesanStatus(n) {
            const bagian = [];
            const koleksi = getKoleksiAktif();
            const ukuran  = document.getElementById('ukuran-select').value;
            const keyword = rapikan(document.getElementById('search-input').value);
            const arah    = document.getElementById('sort-select').value;
            if (koleksi) bagian.push(`koleksi ${koleksi}`);
            if (ukuran)  bagian.push(`ukuran ${ukuran}`);
            if (keyword) bagian.push(`"${keyword}"`);
            let pesan = bagian.length ? `${n} produk · ${bagian.join(' · ')}` : `${n} produk tersedia`;
            if (arah) pesan += ` · ${arah === 'asc' ? 'termurah' : 'termahal'} dulu`;
            return pesan;
        }

        // Alamat di browser ikut berubah sesuai filter → bisa langsung di-copy dan dibagikan
        function perbaruiURL() {
            const p = new URLSearchParams();
            const koleksi = getKoleksiAktif();
            const keyword = rapikan(document.getElementById('search-input').value);
            const ukuran  = document.getElementById('ukuran-select').value;
            const arah    = document.getElementById('sort-select').value;
            if (koleksi) p.set('koleksi', koleksi);
            if (keyword) p.set('q', keyword);
            if (ukuran)  p.set('ukuran', ukuran);
            if (arah)    p.set('urut', arah === 'asc' ? 'termurah' : 'termahal');
            const qs = p.toString();
            try { history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '')); } catch (_) {}
        }

        // Baca ?koleksi= ?q= ?ukuran= ?urut= saat halaman dibuka
        function bacaURLParam() {
            const p = new URLSearchParams(location.search);
            const koleksi = rapikan(p.get('koleksi'));
            const q       = rapikan(p.get('q'));
            const ukuran  = p.get('ukuran') ? rapikanUkuran(p.get('ukuran')) : '';
            const urut    = (p.get('urut') || '').toLowerCase();

            setKoleksiAktif(koleksi);
            document.getElementById('search-input').value = q;
            const sel = document.getElementById('ukuran-select');
            sel.value = [...sel.options].some(o => o.value === ukuran) ? ukuran : '';
            document.getElementById('sort-select').value =
                (urut === 'termurah' || urut === 'asc') ? 'asc' : (urut === 'termahal' || urut === 'desc') ? 'desc' : '';

            terapkanFilter({ scroll: !!q });
        }

        function filterKoleksi(btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            terapkanFilter();
        }

        function cariProduk() {
            const keyword = rapikan(document.getElementById('search-input').value);
            const pesanReset = [];

            // Mengetik pencarian → reset filter koleksi & ukuran supaya hasil tidak kosong
            if (keyword && getKoleksiAktif()) {
                setKoleksiAktif('');
                pesanReset.push('koleksi');
            }
            const ukuranSelect = document.getElementById('ukuran-select');
            if (keyword && ukuranSelect.value !== '') {
                ukuranSelect.value = '';
                pesanReset.push('ukuran');
            }
            if (pesanReset.length) tampilkanToast(`Filter ${pesanReset.join(' & ')} direset otomatis`);

            terapkanFilter();
        }

        function filterUkuran() { terapkanFilter(); }
        function sortProduk()   { terapkanFilter(); }

        function buatTombolFilter() {
            const bar = document.getElementById('filter-bar'), frag = document.createDocumentFragment();
            const tambah = (label, koleksi) => {
                const btn = document.createElement('button');
                btn.textContent = label.toUpperCase();
                btn.className = 'filter-btn';
                btn.dataset.koleksi = koleksi;
                btn.onclick = e => filterKoleksi(e.currentTarget);
                frag.appendChild(btn);
            };
            tambah('Semua', '');
            [...new Set(semuaProduk.map(p => p.koleksi))].forEach(k => tambah(k, k));
            bar.innerHTML = ''; bar.appendChild(frag);
            bar.firstChild.classList.add('active');

            // Dropdown ukuran: urut dari yang terkecil (berdasarkan luas)
            const semuaUkuran = [...new Set(semuaProduk.flatMap(p => p.variasi.map(v => v.ukuran)))]
                .filter(u => u && u !== '-')
                .sort((a, b) => luasUkuran(a) - luasUkuran(b) || a.localeCompare(b));
            const sel = document.getElementById('ukuran-select');
            sel.innerHTML = '<option value="">Semua Ukuran</option>';
            semuaUkuran.forEach(u => {
                const opt = document.createElement('option');
                opt.value = u; opt.textContent = u;
                sel.appendChild(opt);
            });
        }

        /* ───────── Render katalog ───────── */

        function setStatus(msg) {
            document.getElementById('status-text').textContent = msg;
            document.getElementById('status-text').style.display = 'block';
            document.getElementById('ornament').style.display = 'block';
        }

        function tampilkanKatalog(data, halaman = 1) {
            // Produk yang semua ukurannya habis diletakkan di bawah (urutan lain tetap)
            const adaStok   = data.filter(p => p.variasi.some(v => v.stok > 0));
            const stokHabis = data.filter(p => !p.variasi.some(v => v.stok > 0));
            dataTampil  = [...adaStok, ...stokHabis];
            halamanSaat = 0;
            if (lazyObserver) lazyObserver.disconnect();

            const container = document.getElementById('katalog-container');
            if (!dataTampil.length) {
                container.innerHTML = `<p style="grid-column:1/-1;text-align:center;padding:4rem 1rem;color:var(--muted);font-style:italic">Produk tidak ditemukan.</p>`;
                updateLoadMore();
                return;
            }
            container.innerHTML = '';
            for (let i = 0; i < halaman && halamanSaat * PER_HALAMAN < dataTampil.length; i++) renderBatch();
        }

        function renderBatch() {
            const container = document.getElementById('katalog-container');
            const mulai = halamanSaat * PER_HALAMAN;
            const batch = dataTampil.slice(mulai, mulai + PER_HALAMAN);
            container.insertAdjacentHTML('beforeend', batch.map((item, i) => buatCardHTML(item, mulai + i)).join(''));
            halamanSaat++;
            initLazyLoading();
            updateLoadMore();
        }

        function updateLoadMore() {
            const wrap = document.getElementById('load-more-wrap');
            const btn  = document.getElementById('load-more-btn');
            const info = document.getElementById('load-more-info');
            const total = dataTampil.length;
            const sudahTampil = Math.min(halamanSaat * PER_HALAMAN, total);

            if (total <= PER_HALAMAN) { wrap.style.display = 'none'; return; }
            wrap.style.display = 'block';
            if (sudahTampil < total) {
                btn.style.display = 'inline-block';
                info.textContent = `Menampilkan ${sudahTampil} dari ${total} produk`;
            } else {
                btn.style.display = 'none';
                info.textContent = `Semua ${total} produk sudah ditampilkan`;
            }
        }

        function muatLebihBanyak() {
            const mulai = halamanSaat * PER_HALAMAN;
            renderBatch();
            const cardBaru = document.querySelectorAll('#katalog-container .card')[mulai];
            if (cardBaru) cardBaru.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // Variasi default: ukuran yang difilter → ukuran pertama yang ada stok → ukuran pertama
        function variasiAwal(item) {
            const filterUkuran = document.getElementById('ukuran-select').value;
            let i = filterUkuran ? item.variasi.findIndex(v => v.ukuran === filterUkuran) : -1;
            if (i < 0) i = item.variasi.findIndex(v => v.stok > 0);
            return i < 0 ? 0 : i;
        }

        function buatCardHTML(item, idx) {
            const vi  = variasiAwal(item);
            const def = item.variasi[vi];
            const habis = !(def.stok > 0);

            const ukuranBtns = item.variasi.map((v, j) =>
                `<button type="button" class="ukuran-btn ${j === vi ? 'selected' : ''}" data-v="${j}">${esc(v.ukuran)}</button>`
            ).join('');

            return `
            <div class="card" data-i="${idx}" data-v="${vi}">
                <div class="card-img-wrap">
                    <img class="lazy-img"
                         data-src="${esc(fotoKecil(def.foto))}"
                         src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
                         alt="${esc(item.koleksi + ' ' + item.nama)}" decoding="async">
                    ${habis ? `<div class="stok-habis-overlay"><span class="stok-habis-badge">Stok Habis</span></div>` : ''}
                </div>
                <div class="card-body">
                    <p class="card-koleksi">${esc(item.koleksi)}</p>
                    <h3 class="card-nama">${esc(item.nama)}</h3>
                    ${item.variasi.length > 1 ? `
                    <div>
                        <p class="ukuran-label">Pilih Ukuran</p>
                        <div class="ukuran-overlay">${ukuranBtns}</div>
                    </div>` : `
                    <div class="ukuran-overlay">${ukuranBtns}</div>`}
                    <div class="card-footer">
                        <div class="card-footer-price">
                            <div class="card-price-wrap">
                                <span class="card-price-label">Harga</span>
                                <p class="card-price ${def.harga > 0 ? '' : 'tanya'}">${teksHarga(def.harga)}</p>
                            </div>
                        </div>
                        <div class="card-footer-actions">
                            <span class="card-stok ${habis ? 'stok-habis' : 'stok-ada'}">● Stok: ${def.stok}</span>
                            <div style="display:flex;gap:0.3rem;align-items:center">
                                <button type="button" class="share-btn" aria-label="Bagikan produk">
                                    <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                                        <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
                                        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
                                    </svg>
                                </button>
                                <a href="${esc(buildWaLink(item, def))}"
                                   class="wa-btn" target="_blank" rel="noopener noreferrer" aria-label="Tanya lewat WhatsApp">${WA_ICON}</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        // Klik di dalam card ditangani di satu tempat (aman untuk nama yang mengandung tanda kutip)
        document.getElementById('katalog-container').addEventListener('click', e => {
            const card = e.target.closest('.card[data-i]');
            if (!card) return;
            const item = dataTampil[+card.dataset.i];
            if (!item) return;

            const ukBtn = e.target.closest('.ukuran-btn');
            if (ukBtn) { pilihVariasi(card, item, +ukBtn.dataset.v); return; }

            if (e.target.closest('.share-btn')) { shareProduct(item, item.variasi[+card.dataset.v]); return; }

            if (e.target.closest('.card-img-wrap')) openZoom(fotoBesar(item.variasi[+card.dataset.v].foto));
        });

        function pilihVariasi(card, item, j) {
            const v = item.variasi[j];
            if (!v) return;
            card.dataset.v = j;

            const img = card.querySelector('.lazy-img');
            const src = fotoKecil(v.foto);
            img.dataset.src = src;
            if (img.getAttribute('src') !== src) {
                img.classList.remove('loaded');
                img.onload  = () => img.classList.add('loaded');
                img.onerror = () => { img.onerror = null; img.src = FOTO_ERROR; img.classList.add('loaded'); };
                img.src = src;
                if (lazyObserver) lazyObserver.unobserve(img);
            }

            const harga = card.querySelector('.card-price');
            harga.textContent = teksHarga(v.harga);
            harga.classList.toggle('tanya', !(v.harga > 0));

            const habis = !(v.stok > 0);
            const stok = card.querySelector('.card-stok');
            stok.textContent = `● Stok: ${v.stok}`;
            stok.className = `card-stok ${habis ? 'stok-habis' : 'stok-ada'}`;

            const wrap = card.querySelector('.card-img-wrap');
            let overlay = wrap.querySelector('.stok-habis-overlay');
            if (habis && !overlay) {
                overlay = document.createElement('div');
                overlay.className = 'stok-habis-overlay';
                overlay.innerHTML = '<span class="stok-habis-badge">Stok Habis</span>';
                wrap.appendChild(overlay);
            } else if (!habis && overlay) {
                overlay.remove();
            }

            card.querySelector('.wa-btn').href = buildWaLink(item, v);
            card.querySelectorAll('.ukuran-btn').forEach(b => b.classList.toggle('selected', +b.dataset.v === j));
        }

        function linkProduk(item) {
            return location.origin + location.pathname + '?q=' + encodeURIComponent(item.koleksi + ' ' + item.nama);
        }

        function buildWaLink(item, v) {
            const pesan = `Halo Aneka Karpet Indah, saya mau tanya karpet ${item.koleksi} ${item.nama} ukuran ${v.ukuran}.`
                + `\nLihat di katalog: ${linkProduk(item)}`;
            return 'https://wa.me/' + WA_NUMBER + '?text=' + encodeURIComponent(pesan);
        }

        function shareProduct(item, v) {
            const teks = `Lihat karpet ${item.koleksi} ${item.nama} ukuran ${v.ukuran} di Aneka Karpet Indah!\n${linkProduk(item)}`;
            if (navigator.share) {
                // Kirim hanya text agar link tidak dobel di HP
                navigator.share({ title: `${item.koleksi} ${item.nama}`, text: teks }).catch(() => {});
            } else if (navigator.clipboard) {
                navigator.clipboard.writeText(teks)
                    .then(() => tampilkanToast('Link produk disalin!'))
                    .catch(() => tampilkanToast('Gagal menyalin link'));
            } else {
                tampilkanToast('Browser tidak mendukung bagikan');
            }
        }

        function initLazyLoading() {
            if (!lazyObserver) {
                lazyObserver = new IntersectionObserver((entries, obs) => {
                    entries.forEach(e => {
                        if (!e.isIntersecting) return;
                        const img = e.target, src = img.dataset.src;
                        obs.unobserve(img);
                        if (!src) return;
                        img.onload  = () => img.classList.add('loaded');
                        img.onerror = () => { img.onerror = null; img.src = FOTO_ERROR; img.classList.add('loaded'); };
                        img.src = src;
                    });
                }, { rootMargin: '200px 0px' });
            }
            document.querySelectorAll('#katalog-container .lazy-img:not(.loaded)').forEach(img => {
                if (img.getAttribute('src').startsWith('data:')) lazyObserver.observe(img);
            });
        }

        /* ───────── Zoom & toast ───────── */

        function openZoom(src) {
            const img = document.getElementById('img-zoom');
            img.onerror = () => { img.onerror = null; img.src = FOTO_ERROR; };
            img.src = src;
            document.getElementById('modal-zoom').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }
        function closeZoom() {
            document.getElementById('modal-zoom').style.display = 'none';
            document.body.style.overflow = '';
        }
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeZoom(); });

        function tampilkanToast(pesan) {
            let toast = document.getElementById('toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'toast';
                toast.style.cssText = `
                    position:fixed; bottom:1.5rem; left:50%; transform:translateX(-50%) translateY(20px);
                    background:var(--text); color:var(--bg); padding:0.55rem 1.1rem;
                    border-radius:999px; font-size:0.72rem; font-weight:600;
                    font-family:'DM Sans',sans-serif; z-index:200; opacity:0;
                    transition:opacity 0.25s ease, transform 0.25s ease;
                    white-space:nowrap; pointer-events:none;
                `;
                document.body.appendChild(toast);
            }
            toast.textContent = pesan;
            toast.offsetHeight; // paksa reflow agar transisi berjalan
            toast.style.opacity = '1';
            toast.style.transform = 'translateX(-50%) translateY(0)';
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(-50%) translateY(20px)';
            }, 2500);
        }

        document.getElementById('search-input').addEventListener('input', debounce(cariProduk, 250));
        ambilData();
    </script>
</body>
</html>
