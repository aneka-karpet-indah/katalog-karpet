    <style>
        :root {
            --bg:          #F5F0E8;
            --surface:     #FFFCF7;
            --border:      #DCD2C1;
            --text:        #2E2018;
            --muted:       #6B5A4A;
            --accent:      #A9552F;
            --accent-soft: #F3E2D6;
            --ok:          #4E6B3E;
            --no:          #B3261E;
            --wa:          #1F7A4D;
            --shadow:      rgba(46,32,24,0.10);
            --radius:      16px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        img { max-width: 100%; display: block; }
        button, input, select { font: inherit; color: inherit; }
        button { background: none; border: 0; cursor: pointer; }
        input[type="search"] { -webkit-appearance: none; appearance: none; }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', system-ui, sans-serif;
            font-size: 16px; line-height: 1.5;
            min-height: 100vh;
        }

        /* ── HEADER ── */
        header {
            position: sticky; top: 0; z-index: 50;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }
        .header-inner { max-width: 1400px; margin: 0 auto; padding: 12px 16px 0; }
        .header-top { display: flex; flex-direction: column; gap: 12px; }
        .brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .brand-logo { height: 34px; width: auto; }
        .brand-tagline { font-size: 12px; color: var(--muted); letter-spacing: 0.04em; margin-top: 2px; }
        .icon-btn {
            width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0;
            border: 1.5px solid var(--border); background: var(--surface);
            display: grid; place-items: center; color: var(--muted);
            transition: border-color .2s, color .2s; text-decoration: none;
        }
        .icon-btn:hover { border-color: #C13584; color: #C13584; }

        .search-row { display: flex; gap: 8px; }
        .search-wrap { flex: 1; position: relative; }
        .search-wrap input {
            width: 100%; height: 44px; border-radius: 12px;
            border: 1.5px solid var(--border); background: var(--bg);
            padding: 0 14px 0 42px; font-size: 16px; color: var(--text);
            transition: border-color .2s, box-shadow .2s;
        }
        .search-wrap input::placeholder { color: var(--muted); }
        .search-wrap input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(169,85,47,0.15); }
        .search-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }

        .filter-btn-open {
            height: 44px; padding: 0 14px; border-radius: 12px; flex-shrink: 0;
            border: 1.5px solid var(--border); background: var(--surface);
            display: flex; align-items: center; gap: 6px;
            font-size: 14px; font-weight: 700; color: var(--text); position: relative;
            transition: border-color .2s;
        }
        .filter-btn-open:hover { border-color: var(--accent); }
        .filter-btn-open .count {
            min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px;
            background: var(--accent); color: #fff; font-size: 12px; line-height: 20px; text-align: center;
            display: none;
        }
        .filter-btn-open.aktif { border-color: var(--accent); color: var(--accent); }
        .filter-btn-open.aktif .count { display: inline-block; }

        .filter-bar {
            display: flex; gap: 8px; overflow-x: auto; padding: 12px 0;
            scrollbar-width: none; -webkit-overflow-scrolling: touch;
        }
        .filter-bar::-webkit-scrollbar { display: none; }
        .filter-btn {
            flex-shrink: 0; min-height: 36px; padding: 0 16px; border-radius: 999px;
            border: 1.5px solid var(--border); background: var(--surface);
            font-size: 13px; font-weight: 700; color: var(--muted); white-space: nowrap;
            transition: border-color .2s, color .2s, background .2s;
        }
        .filter-btn:hover { border-color: var(--text); color: var(--text); }
        .filter-btn.active { background: var(--text); border-color: var(--text); color: #fff; }

        @media (min-width: 900px) {
            .header-inner { padding: 14px 24px 0; }
            .header-top { flex-direction: row; align-items: center; gap: 24px; }
            .brand { flex-shrink: 0; }
            .search-row { flex: 1; max-width: 720px; margin-left: auto; }
            .filter-bar { scrollbar-width: thin; scrollbar-color: var(--border) transparent; padding-bottom: 10px; }
            .filter-bar::-webkit-scrollbar { display: block; height: 6px; }
            .filter-bar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        }

        /* ── STATUS ── */
        .status-row {
            max-width: 1400px; margin: 0 auto; padding: 14px 16px 0;

        #reset-filter.tampil { display: inline-block; }
        @media (min-width: 900px) { .status-row { padding: 18px 24px 0; } }

        /* ── GRID ── */
        .katalog-grid {

            gap: 12px; padding: 12px 16px 24px;
            max-width: 1400px; margin: 0 auto;

        @media (min-width: 600px)  { .katalog-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
        @media (min-width: 900px)  { .katalog-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; padding: 16px 24px 32px; } }
        @media (min-width: 1280px) { .katalog-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); } }

        /* ── CARD ── */
        .card {
            background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
            overflow: hidden; display: flex; flex-direction: column;
            transition: box-shadow .2s, transform .2s;

        @media (hover: hover) { .card:hover { box-shadow: 0 8px 24px var(--shadow); transform: translateY(-2px); } }

        .card-img-wrap { position: relative; aspect-ratio: 4/5; background: #E6DCCB; overflow: hidden; cursor: zoom-in; }

        .stok-habis-badge {

            background: var(--no); color: #fff; font-size: 12px; font-weight: 700;

        .card-body { padding: 10px 10px 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
        .card-koleksi { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); line-height: 1.3; }
        .card-nama {

            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .ukuran-label { font-size: 12px; color: var(--muted); line-height: 1.3; }
        .ukuran-list { display: flex; flex-wrap: wrap; gap: 6px; }
        .ukuran-btn {
            min-height: 36px; padding: 0 10px; border-radius: 10px;
            border: 1.5px solid var(--border); background: var(--bg);
            font-size: 13px; font-weight: 700; white-space: nowrap;
            transition: border-color .15s, background .15s, color .15s;
        }
        .ukuran-btn:hover { border-color: var(--accent); }
        .ukuran-btn.kosong { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
        .ukuran-btn.selected { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

        .card-footer { margin-top: auto; display: flex; flex-direction: column; gap: 6px; padding-top: 4px; }
        .card-price { font-family: 'Lora', Georgia, serif; font-size: 18px; font-weight: 600; line-height: 1.2; white-space: nowrap; }
        .card-price.tanya { font-family: 'DM Sans', sans-serif; font-size: 15px; color: var(--accent); }
        .card-stok { font-size: 13px; font-weight: 700; line-height: 1.3; }
        .stok-ada   { color: var(--ok); }
        .stok-habis { color: var(--no); }

        .card-actions { display: flex; gap: 6px; margin-top: 4px; }
        .wa-btn {
            flex: 1; min-width: 0; height: 44px; border-radius: 12px;
            background: var(--wa); color: #fff; text-decoration: none;
            display: flex; align-items: center; justify-content: center; gap: 6px;
            font-size: 14px; font-weight: 700; transition: filter .2s;
        }
        .wa-btn:hover { filter: brightness(1.08); }
        .share-btn {
            width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0;
            border: 1.5px solid var(--border); display: grid; place-items: center; color: var(--muted);
            transition: border-color .2s, color .2s;
        }
        .share-btn:hover { border-color: var(--accent); color: var(--accent); }

        /* ── SKELETON ── */
        .skeleton {
            background: linear-gradient(90deg, #E6DCCB 25%, #F1EADF 50%, #E6DCCB 75%);
            background-size: 200% 100%; animation: shimmer 1.6s infinite;
        }
        @keyframes shimmer { 0% { background-position: 200% 0 } 100% { background-position: -200% 0 } }

        /* ── LAZY IMG ── */
        .lazy-img { opacity: 0; transition: opacity .3s ease; }
        .lazy-img.loaded { opacity: 1; }

        /* ── LOAD MORE ── */
        #load-more-wrap { display: none; text-align: center; padding: 8px 16px 40px; }
        #load-more-btn {
            min-height: 48px; padding: 0 28px; border-radius: 999px;
            background: var(--surface); color: var(--text); border: 1.5px solid var(--text);
            font-size: 15px; font-weight: 700; transition: background .2s, color .2s;
        }
        #load-more-btn:hover { background: var(--text); color: #fff; }
        #load-more-info { margin-top: 8px; font-size: 13px; color: var(--muted); }

        /* ── FILTER SHEET ── */
        #filter-sheet {
            position: fixed; inset: 0; z-index: 90; display: none;
            flex-direction: column; justify-content: flex-end; align-items: center;
            background: rgba(46,32,24,0.45);
        }
        #filter-sheet.open { display: flex; }
        #filter-sheet .sheet-bg { position: absolute; inset: 0; }
        .sheet {
            position: relative; width: 100%; max-width: 560px; max-height: 85vh; overflow-y: auto;
            background: var(--surface); border-radius: 20px 20px 0 0;
            padding: 8px 16px calc(20px + env(safe-area-inset-bottom));
            animation: naik .22s ease-out;
        }
        @keyframes naik { from { transform: translateY(24px); opacity: .6 } to { transform: none; opacity: 1 } }
        @media (min-width: 600px) { #filter-sheet { justify-content: center; } .sheet { border-radius: 20px; } }
        .sheet-grab { width: 40px; height: 4px; border-radius: 2px; background: var(--border); margin: 0 auto 8px; }
        .sheet-head { display: flex; align-items: center; justify-content: space-between; }
        .sheet-head h2 { font-size: 18px; font-weight: 700; }
        .sheet h3 { font-size: 15px; font-weight: 700; margin: 16px 0 10px; }
        .opsi-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .opsi-btn {
            min-height: 44px; padding: 0 14px; border-radius: 12px;
            border: 1.5px solid var(--border); background: var(--bg);
            font-size: 14px; font-weight: 700; transition: border-color .15s, background .15s, color .15s;
        }
        .opsi-btn:hover { border-color: var(--accent); }
        .opsi-btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
        .sheet-actions { display: flex; gap: 8px; margin-top: 24px; position: sticky; bottom: 0; background: var(--surface); padding-top: 8px; }
        .sheet-actions button { flex: 1; height: 48px; border-radius: 12px; font-size: 15px; font-weight: 700; }
        .btn-sec { border: 1.5px solid var(--border) !important; }
        .btn-pri { background: var(--text) !important; color: #fff; }

        /* ── MODAL ZOOM ── */
        #modal-zoom {
            display: none; position: fixed; inset: 0; z-index: 100;
            background: rgba(20,12,6,0.96); align-items: center; justify-content: center;
        }
        #modal-zoom .modal-backdrop { position: absolute; inset: 0; cursor: zoom-out; }
        #modal-zoom .modal-content { position: relative; z-index: 1; }
        #img-zoom { max-width: 92vw; max-height: 88vh; object-fit: contain; border-radius: 12px; }
        #modal-close-btn {
            position: fixed; top: 16px; right: 16px; z-index: 2;
            width: 44px; height: 44px; border-radius: 50%;
            background: rgba(255,252,247,0.15); border: 1.5px solid rgba(255,252,247,0.35);
            color: #fff; display: grid; place-items: center;
        }
        #modal-close-btn:hover { background: rgba(255,252,247,0.28); }

        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    </style>
</head>

        const CACHE_KEY = 'aki_katalog_v4';
        const CACHE_SEGAR = 1 * 60 * 1000; // data di bawah 1 menit tidak diambil ulang
        const FOTO_ERROR = 'https://placehold.co/400x500/e6dccb/6b5a4a?text=Foto+belum+tersedia';
        const PER_HALAMAN = 24;

        let semuaProduk = [], lazyObserver = null;
        let dataTampil = [];   // data yang sedang aktif (hasil filter/search/sort)
        let halamanSaat = 0;   // jumlah batch yang sudah ditampilkan
        const filter = { ukuran: '', urut: '' };   // ukuran & urutan aktif
        const draft  = { ukuran: '', urut: '' };   // pilihan sementara di sheet filter

        const ICON_WA = `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-3.2-.8-2.7-1.1-4.4-3.9-4.5-4.1-.1-.2-1.1-1.4-1.1-2.7 0-1.3.7-1.9.9-2.2.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.1 1 2.1 1.3 2.4 1.4.3.2.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.2 1.3Z"/></svg>`;
        const ICON_SHARE = `<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>`;

        /* ───────── Helper ───────── */

        function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

        // Amankan teks dari sheet sebelum dimasukkan ke HTML (tanda kutip, <, & dll)
        function esc(s) {
            return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
        }

        // Rapikan spasi: "  Almaya  " → "Almaya"
        function rapikan(s) { return String(s ?? '').replace(/\s+/g, ' ').trim(); }

        // Samakan format ukuran: "160x210", "160 X 210", "160 × 210" → "160 x 210"
        function rapikanUkuran(s) {
            const t = rapikan(s);
            const m = t.match(/^(\d+(?:[.,]\d+)?)\s*[x×X*]\s*(\d+(?:[.,]\d+)?)/);
            return m ? `${m[1]} x ${m[2]}` : (t || '-');
        }

        function luasUkuran(u) {
            const m = String(u).match(/^(\d+(?:[.,]\d+)?) x (\d+(?:[.,]\d+)?)/);
            return m ? parseFloat(m[1].replace(',', '.')) * parseFloat(m[2].replace(',', '.')) : Infinity;
        }

        // Angka dari sel sheet; sel kosong / teks aneh → 0
        function angka(v) {
            if (typeof v === 'number' && isFinite(v)) return v;
            const n = parseInt(String(v ?? '').replace(/[^\d]/g, ''), 10);
            return isNaN(n) ? 0 : n;
        }

        function teksHarga(h) { return h > 0 ? 'Rp ' + h.toLocaleString('id-ID') : 'Hubungi kami'; }
        function teksStok(s)  { return s > 0 ? `Ready · ${s} pcs` : 'Stok habis'; }

        // Foto Cloudinary: minta versi yang sudah diperkecil & dikompres otomatis
        function fotoCloudinary(url, lebar) {
            if (!url || !url.includes('res.cloudinary.com') || !url.includes('/image/upload/')) return url;
            return url.replace(/\/image\/upload\/((?:[a-z]{1,3}_[^/]+\/)*)/, `/image/upload/f_auto,q_auto,w_${lebar},c_limit/`);
        }
        const fotoKecil = url => fotoCloudinary(url, 500);
        const fotoBesar = url => fotoCloudinary(url, 1600);

        /* ───────── Ambil & olah data ───────── */

        function bacaCache() {
            try { return JSON.parse(localStorage.getItem(CACHE_KEY)); } catch (_) { return null; }
        }
        function simpanCache(data) {
            try { localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), data })); } catch (_) {}
        }

        async function ambilDariSheet() {
            const res = await fetch(SHEET_URL, { cache: 'no-store' });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const txt = await res.text();
            const json = JSON.parse(txt.slice(txt.indexOf('(') + 1, txt.lastIndexOf(')')));
            return olahBaris(json.table.rows);
        }

        function olahBaris(rows) {
            const grup = {}, namaKoleksi = {};
            let uid = 0;

            rows.forEach(row => {
                const sel = i => (row.c && row.c[i] && row.c[i].v != null) ? row.c[i].v : null;
                const koleksiRaw = rapikan(sel(0));
                if (!koleksiRaw) return; // baris kosong

                // Nama koleksi pakai penulisan yang pertama muncul ("Almaya" & "almaya" jadi satu)
                const kKey = koleksiRaw.toLowerCase();
                const koleksi = namaKoleksi[kKey] || (namaKoleksi[kKey] = koleksiRaw);

                const namaRaw = rapikan(sel(1));
                const ukuran  = rapikanUkuran(sel(2));
                const harga   = angka(sel(3));
                const stok    = angka(sel(4));
                const foto    = rapikan(sel(5));

                const standalone = !namaRaw || namaRaw === '-' || namaRaw.toLowerCase() === 'motif baru';
                const id = standalone ? `standalone-${uid++}` : `${kKey}|${namaRaw.toLowerCase()}`;
                if (!grup[id]) grup[id] = { koleksi, nama: namaRaw || 'Motif Baru', fotoUtama: '', variasi: [] };
                const g = grup[id];
                if (!g.fotoUtama && foto && foto !== '-') g.fotoUtama = foto;
                const fotoFinal = (foto && foto !== '-') ? foto : g.fotoUtama;

                // Deduplikasi: ukuran sama dalam satu produk → pakai baris paling bawah
                const v = { ukuran, harga, stok, foto: fotoFinal };
                const idx = g.variasi.findIndex(x => x.ukuran === ukuran);
                if (idx >= 0) g.variasi[idx] = v; else g.variasi.push(v);
            });

            const hasil = Object.values(grup);
            hasil.forEach(p => {
                p.variasi.forEach(v => { if (!v.foto) v.foto = p.fotoUtama; });
                p.variasi.sort((a, b) => luasUkuran(a.ukuran) - luasUkuran(b.ukuran));
            });
            return hasil;
        }

        // Tampilkan data tersimpan dulu (instan), lalu perbarui diam-diam dari sheet
        async function ambilData() {
            const cache = bacaCache();
            const adaCache = cache && Array.isArray(cache.data) && cache.data.length;

            if (adaCache) {
                semuaProduk = cache.data;
                siapkanHalaman();
                if (Date.now() - cache.ts < CACHE_SEGAR) return;
            }

            try {
                const baru = await ambilDariSheet();
                const berubah = !adaCache || JSON.stringify(baru) !== JSON.stringify(cache.data);
                simpanCache(baru);
                if (!berubah) return;
                semuaProduk = baru;
                if (adaCache) perbaruiDiam(); else siapkanHalaman();
            } catch (err) {
                if (!adaCache) {
                    document.getElementById('katalog-container').innerHTML =
                        `<p style="grid-column:1/-1;text-align:center;padding:4rem 1rem;color:var(--muted)">Gagal memuat data. Coba muat ulang halaman.</p>`;
                    document.getElementById('status-text').textContent = '';
                }
                // Kalau ada data tersimpan, katalog tetap tampil walau sheet gagal diakses
            }
        }

        function siapkanHalaman() {
            buatTombolFilter();
            bacaURLParam();
        }

        // Data baru datang saat customer sudah melihat katalog: pertahankan filter & jumlah produk yang sudah dimuat
        function perbaruiDiam() {
            const koleksiAktif = getKoleksiAktif();
            const halaman      = Math.max(1, halamanSaat);
            buatTombolFilter();
            setKoleksiAktif(koleksiAktif);
            if (filter.ukuran && !semuaUkuran().includes(filter.ukuran)) filter.ukuran = '';
            terapkanFilter({ halaman });
        }

        /* ───────── Filter, sort, URL ───────── */

        function getKoleksiAktif() {
            const btn = document.querySelector('.filter-btn.active');
            return btn ? (btn.dataset.koleksi || '') : '';
        }
        function setKoleksiAktif(koleksi) {
            let cocok = false;
            document.querySelectorAll('.filter-btn').forEach(b => {
                const aktif = (b.dataset.koleksi || '').toLowerCase() === (koleksi || '').toLowerCase();
                b.classList.toggle('active', aktif);
                b.setAttribute('aria-pressed', aktif);
                if (aktif) cocok = true;
            });
            if (!cocok) {
                const semua = document.querySelector('.filter-btn');
                semua.classList.add('active'); semua.setAttribute('aria-pressed', true);
            }
        }

        function semuaUkuran() {
            return [...new Set(semuaProduk.flatMap(p => p.variasi.map(v => v.ukuran)))]
                .filter(u => u && u !== '-')
                .sort((a, b) => luasUkuran(a) - luasUkuran(b) || a.localeCompare(b));
        }

        function getFilteredData(ukuran = filter.ukuran) {
            const keyword = rapikan(document.getElementById('search-input').value).toLowerCase();
            const koleksi = getKoleksiAktif();
            return semuaProduk.filter(p =>
                (!koleksi || p.koleksi === koleksi) &&
                (!keyword || (p.koleksi + ' ' + p.nama).toLowerCase().includes(keyword)) &&
                (!ukuran || p.variasi.some(v => v.ukuran === ukuran))
            );
        }

        // Harga untuk urutan: ukuran terpilih (kalau ada filter), selain itu harga termurah yang masih ada stok
        function hargaUntukUrut(p, ukuran) {
            let pilihan = ukuran ? p.variasi.filter(v => v.ukuran === ukuran) : p.variasi.filter(v => v.stok > 0);
            if (!pilihan.length) pilihan = p.variasi;
            const harga = pilihan.map(v => v.harga).filter(h => h > 0);
            return harga.length ? Math.min(...harga) : null;
        }

        function urutkan(data) {
            if (!filter.urut) return data;
            return [...data].sort((a, b) => {
                const hA = hargaUntukUrut(a, filter.ukuran), hB = hargaUntukUrut(b, filter.ukuran);
                if (hA === null) return 1;   // harga kosong selalu di bawah
                if (hB === null) return -1;
                return filter.urut === 'asc' ? hA - hB : hB - hA;
            });
        }

        // Satu pintu untuk semua perubahan filter → urutan harga tidak pernah hilang
        function terapkanFilter({ halaman = 1, scroll = false } = {}) {
            const hasil = urutkan(getFilteredData());
            tampilkanKatalog(hasil, halaman);
            perbaruiStatus(hasil.length);
            perbaruiTombolFilter();
            perbaruiURL();
            if (scroll) setTimeout(() => document.querySelector('.status-row').scrollIntoView({ behavior: 'smooth', block: 'start' }), 400);
        }

        function perbaruiStatus(n) {
            const bagian = [];
            const koleksi = getKoleksiAktif();
            const keyword = rapikan(document.getElementById('search-input').value);
            if (koleksi)       bagian.push(koleksi);
            if (filter.ukuran) bagian.push(filter.ukuran);
            if (keyword)       bagian.push(`"${keyword}"`);
            if (filter.urut)   bagian.push(filter.urut === 'asc' ? 'termurah dulu' : 'termahal dulu');
            document.getElementById('status-text').textContent =
                bagian.length ? `${n} produk · ${bagian.join(' · ')}` : `${n} produk tersedia`;
            document.getElementById('reset-filter').classList.toggle('tampil', bagian.length > 0);
        }

        function perbaruiTombolFilter() {
            const n = (filter.ukuran ? 1 : 0) + (filter.urut ? 1 : 0);
            const btn = document.getElementById('filter-open');
            btn.classList.toggle('aktif', n > 0);
            document.getElementById('filter-count').textContent = n || '';
            btn.setAttribute('aria-label', n ? `Filter, ${n} aktif` : 'Filter ukuran dan urutan');
        }

        // Alamat di browser ikut berubah sesuai filter → bisa langsung di-copy dan dibagikan
        function perbaruiURL() {
            const p = new URLSearchParams();
            const koleksi = getKoleksiAktif();
            const keyword = rapikan(document.getElementById('search-input').value);
            if (koleksi)       p.set('koleksi', koleksi);
            if (keyword)       p.set('q', keyword);
            if (filter.ukuran) p.set('ukuran', filter.ukuran);
            if (filter.urut)   p.set('urut', filter.urut === 'asc' ? 'termurah' : 'termahal');
            const qs = p.toString();
            try { history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '')); } catch (_) {}
        }

        // Baca ?koleksi= ?q= ?ukuran= ?urut= saat halaman dibuka
        function bacaURLParam() {
            const p = new URLSearchParams(location.search);
            const q      = rapikan(p.get('q'));
            const ukuran = p.get('ukuran') ? rapikanUkuran(p.get('ukuran')) : '';
            const urut   = (p.get('urut') || '').toLowerCase();

            setKoleksiAktif(rapikan(p.get('koleksi')));
            document.getElementById('search-input').value = q;
            filter.ukuran = semuaUkuran().includes(ukuran) ? ukuran : '';
            filter.urut   = (urut === 'termurah' || urut === 'asc') ? 'asc' : (urut === 'termahal' || urut === 'desc') ? 'desc' : '';

            terapkanFilter({ scroll: !!q });
        }

        function filterKoleksi(btn) {
            setKoleksiAktif(btn.dataset.koleksi);
            terapkanFilter();
        }

        function cariProduk() {
            const keyword = rapikan(document.getElementById('search-input').value);
            const pesanReset = [];

            // Mengetik pencarian → reset filter koleksi & ukuran supaya hasil tidak kosong
            if (keyword && getKoleksiAktif()) { setKoleksiAktif(''); pesanReset.push('koleksi'); }
            if (keyword && filter.ukuran)     { filter.ukuran = ''; pesanReset.push('ukuran'); }
            if (pesanReset.length) tampilkanToast(`Filter ${pesanReset.join(' & ')} direset otomatis`);

            terapkanFilter();
        }

        function hapusSemuaFilter() {
            setKoleksiAktif('');
            document.getElementById('search-input').value = '';
            filter.ukuran = ''; filter.urut = '';
            terapkanFilter();
        }

        function buatTombolFilter() {
            const bar = document.getElementById('filter-bar'), frag = document.createDocumentFragment();
            const tambah = (label, koleksi) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = label.toUpperCase();
                btn.className = 'filter-btn';
                btn.dataset.koleksi = koleksi;
                btn.onclick = e => filterKoleksi(e.currentTarget);
                frag.appendChild(btn);
            };
            tambah('Semua', '');
            [...new Set(semuaProduk.map(p => p.koleksi))].forEach(k => tambah(k, k));
            bar.innerHTML = ''; bar.appendChild(frag);
            setKoleksiAktif('');

            // Pilihan ukuran di sheet filter: urut dari yang terkecil
            document.getElementById('opsi-ukuran').innerHTML =
                `<button type="button" class="opsi-btn" data-ukuran="">Semua</button>` +
                semuaUkuran().map(u => `<button type="button" class="opsi-btn" data-ukuran="${esc(u)}">${esc(u)}</button>`).join('');
        }

        /* ───────── Sheet filter ───────── */

        function bukaFilter() {
            draft.ukuran = filter.ukuran; draft.urut = filter.urut;
            renderDraft();
            document.getElementById('filter-sheet').classList.add('open');
            document.body.style.overflow = 'hidden';
            setTimeout(() => document.querySelector('#filter-sheet .opsi-btn[aria-pressed="true"]')?.focus(), 50);
        }
        function tutupFilter() {
            document.getElementById('filter-sheet').classList.remove('open');
            document.body.style.overflow = '';
            document.getElementById('filter-open').focus();
        }
        function renderDraft() {
            document.querySelectorAll('#opsi-ukuran .opsi-btn').forEach(b => b.setAttribute('aria-pressed', b.dataset.ukuran === draft.ukuran));
            document.querySelectorAll('#opsi-urut .opsi-btn').forEach(b => b.setAttribute('aria-pressed', b.dataset.urut === draft.urut));
            const n = getFilteredData(draft.ukuran).length;
            const apply = document.getElementById('sheet-apply');
            apply.textContent = n ? `Tampilkan ${n} Produk` : 'Tidak Ada Produk';
            apply.disabled = !n;
            apply.style.opacity = n ? '' : '.5';
        }

        document.getElementById('filter-open').addEventListener('click', bukaFilter);
        document.getElementById('filter-sheet').addEventListener('click', e => {
            if (e.target.closest('[data-tutup]')) { tutupFilter(); return; }
            const uk = e.target.closest('[data-ukuran]');
            if (uk) { draft.ukuran = uk.dataset.ukuran; renderDraft(); return; }
            const ur = e.target.closest('[data-urut]');
            if (ur) { draft.urut = ur.dataset.urut; renderDraft(); }
        });
        document.getElementById('sheet-reset').addEventListener('click', () => { draft.ukuran = ''; draft.urut = ''; renderDraft(); });
        document.getElementById('sheet-apply').addEventListener('click', () => {
            filter.ukuran = draft.ukuran; filter.urut = draft.urut;
            tutupFilter();
            terapkanFilter();
        });
        document.getElementById('reset-filter').addEventListener('click', hapusSemuaFilter);

        /* ───────── Render katalog ───────── */

        function tampilkanKatalog(data, halaman = 1) {
            // Produk yang semua ukurannya habis diletakkan di bawah (urutan lain tetap)
            const adaStok   = data.filter(p => p.variasi.some(v => v.stok > 0));
            const stokHabis = data.filter(p => !p.variasi.some(v => v.stok > 0));
            dataTampil  = [...adaStok, ...stokHabis];
            halamanSaat = 0;
            if (lazyObserver) lazyObserver.disconnect();

            const container = document.getElementById('katalog-container');
            if (!dataTampil.length) {
                container.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:4rem 1rem;color:var(--muted)">
                    <p style="margin-bottom:16px">Produk tidak ditemukan.</p>
                    <button type="button" id="load-more-btn-reset" onclick="hapusSemuaFilter()" style="min-height:44px;padding:0 20px;border-radius:999px;border:1.5px solid var(--text);font-weight:700">Lihat semua produk</button>
                </div>`;
                updateLoadMore();
                return;
            }
            container.innerHTML = '';
            for (let i = 0; i < halaman && halamanSaat * PER_HALAMAN < dataTampil.length; i++) renderBatch();
        }

        function renderBatch() {
            const container = document.getElementById('katalog-container');
            const mulai = halamanSaat * PER_HALAMAN;
            const batch = dataTampil.slice(mulai, mulai + PER_HALAMAN);
            container.insertAdjacentHTML('beforeend', batch.map((item, i) => buatCardHTML(item, mulai + i)).join(''));
            halamanSaat++;
            initLazyLoading();
            updateLoadMore();
        }

        function updateLoadMore() {
            const wrap = document.getElementById('load-more-wrap');
            const btn  = document.getElementById('load-more-btn');
            const info = document.getElementById('load-more-info');
            const total = dataTampil.length;
            const sudahTampil = Math.min(halamanSaat * PER_HALAMAN, total);

            if (total <= PER_HALAMAN) { wrap.style.display = 'none'; return; }
            wrap.style.display = 'block';
            if (sudahTampil < total) {
                btn.style.display = 'inline-block';
                info.textContent = `Menampilkan ${sudahTampil} dari ${total} produk`;
            } else {
                btn.style.display = 'none';
                info.textContent = `Semua ${total} produk sudah ditampilkan`;
            }
        }

        function muatLebihBanyak() {
            const mulai = halamanSaat * PER_HALAMAN;
            renderBatch();
            const cardBaru = document.querySelectorAll('#katalog-container .card')[mulai];
            if (cardBaru) {
                cardBaru.scrollIntoView({ behavior: 'smooth', block: 'start' });
                cardBaru.querySelector('.ukuran-btn, .wa-btn')?.focus({ preventScroll: true });
            }
        }
        document.getElementById('load-more-btn').addEventListener('click', muatLebihBanyak);

        // Variasi default: ukuran yang difilter → ukuran pertama yang ada stok → ukuran pertama
        function variasiAwal(item) {
            let i = filter.ukuran ? item.variasi.findIndex(v => v.ukuran === filter.ukuran) : -1;
            if (i < 0) i = item.variasi.findIndex(v => v.stok > 0);
            return i < 0 ? 0 : i;
        }

        function buatCardHTML(item, idx) {
            const vi  = variasiAwal(item);
            const def = item.variasi[vi];
            const habis = !(def.stok > 0);
            const banyak = item.variasi.length > 1;

            const ukuranBtns = item.variasi.map((v, j) =>
                `<button type="button" class="ukuran-btn ${j === vi ? 'selected' : ''} ${v.stok > 0 ? '' : 'kosong'}" data-v="${j}" aria-pressed="${j === vi}"${v.stok > 0 ? '' : ' aria-label="' + esc(v.ukuran) + ', stok habis"'}>${esc(v.ukuran)}</button>`
            ).join('');

            return `
            <article class="card" data-i="${idx}" data-v="${vi}">
                <div class="card-img-wrap ${habis ? 'habis' : ''}" role="button" tabindex="0" aria-label="Perbesar foto ${esc(item.koleksi + ' ' + item.nama)}">
                    <img class="lazy-img"
                         data-src="${esc(fotoKecil(def.foto))}"
                         src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
                         alt="${esc(item.koleksi + ' ' + item.nama)}" decoding="async">
                    ${habis ? '<span class="stok-habis-badge">Stok Habis</span>' : ''}
                </div>
                <div class="card-body">
                    <p class="card-koleksi">${esc(item.koleksi)}</p>
                    <h3 class="card-nama">${esc(item.nama)}</h3>
                    ${banyak ? `<p class="ukuran-label">${item.variasi.length} ukuran tersedia:</p>` : ''}
                    <div class="ukuran-list" role="group" aria-label="Pilih ukuran">${ukuranBtns}</div>
                    <div class="card-footer">
                        <p class="card-price ${def.harga > 0 ? '' : 'tanya'}">${teksHarga(def.harga)}</p>
                        <p class="card-stok ${habis ? 'stok-habis' : 'stok-ada'}">${teksStok(def.stok)}</p>
                        <div class="card-actions">
                            <a href="${esc(buildWaLink(item, def))}" class="wa-btn" target="_blank" rel="noopener noreferrer"
                               aria-label="Tanya ${esc(item.koleksi + ' ' + item.nama)} lewat WhatsApp">${ICON_WA} Tanya</a>
                            <button type="button" class="share-btn" aria-label="Bagikan produk">${ICON_SHARE}</button>
                        </div>
                    </div>
                </div>
            </article>`;
        }

        // Klik di dalam card ditangani di satu tempat (aman untuk nama yang mengandung tanda kutip)
        const katalog = document.getElementById('katalog-container');
        katalog.addEventListener('click', e => {
            const card = e.target.closest('.card[data-i]');
            if (!card) return;
            const item = dataTampil[+card.dataset.i];
            if (!item) return;

            const ukBtn = e.target.closest('.ukuran-btn');
            if (ukBtn) { pilihVariasi(card, item, +ukBtn.dataset.v); return; }

            if (e.target.closest('.share-btn')) { shareProduct(item, item.variasi[+card.dataset.v]); return; }

            if (e.target.closest('.card-img-wrap')) openZoom(fotoBesar(item.variasi[+card.dataset.v].foto), item.koleksi + ' ' + item.nama);
        });
        katalog.addEventListener('keydown', e => {
            if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('card-img-wrap')) {
                e.preventDefault(); e.target.click();
            }
        });

        function pilihVariasi(card, item, j) {
            const v = item.variasi[j];
            if (!v) return;
            card.dataset.v = j;

            const img = card.querySelector('.lazy-img');
            const src = fotoKecil(v.foto);
            img.dataset.src = src;
            if (img.getAttribute('src') !== src) {
                img.classList.remove('loaded');
                img.onload  = () => img.classList.add('loaded');
                img.onerror = () => { img.onerror = null; img.src = FOTO_ERROR; img.classList.add('loaded'); };
                img.src = src;
                if (lazyObserver) lazyObserver.unobserve(img);
            }

            const harga = card.querySelector('.card-price');
            harga.textContent = teksHarga(v.harga);
            harga.classList.toggle('tanya', !(v.harga > 0));

            const habis = !(v.stok > 0);
            const stok = card.querySelector('.card-stok');
            stok.textContent = teksStok(v.stok);
            stok.className = `card-stok ${habis ? 'stok-habis' : 'stok-ada'}`;

            const wrap = card.querySelector('.card-img-wrap');
            wrap.classList.toggle('habis', habis);
            let badge = wrap.querySelector('.stok-habis-badge');
            if (habis && !badge) {
                badge = document.createElement('span');
                badge.className = 'stok-habis-badge';
                badge.textContent = 'Stok Habis';
                wrap.appendChild(badge);
            } else if (!habis && badge) {
                badge.remove();
            }

            card.querySelector('.wa-btn').href = buildWaLink(item, v);
            card.querySelectorAll('.ukuran-btn').forEach(b => {
                const on = +b.dataset.v === j;
                b.classList.toggle('selected', on);
                b.setAttribute('aria-pressed', on);
            });
        }

        function linkProduk(item) {
            return location.origin + location.pathname + '?q=' + encodeURIComponent(item.koleksi + ' ' + item.nama);
        }

        function buildWaLink(item, v) {
            const pesan = `Halo Aneka Karpet Indah, saya mau tanya karpet ${item.koleksi} ${item.nama} ukuran ${v.ukuran}.`
                + `\nLihat di katalog: ${linkProduk(item)}`;
            return 'https://wa.me/' + WA_NUMBER + '?text=' + encodeURIComponent(pesan);
        }

        function shareProduct(item, v) {
            const teks = `Lihat karpet ${item.koleksi} ${item.nama} ukuran ${v.ukuran} di Aneka Karpet Indah!\n${linkProduk(item)}`;
            if (navigator.share) {
                // Kirim hanya text agar link tidak dobel di HP
                navigator.share({ title: `${item.koleksi} ${item.nama}`, text: teks }).catch(() => {});
            } else if (navigator.clipboard) {
                navigator.clipboard.writeText(teks)
                    .then(() => tampilkanToast('Link produk disalin!'))
                    .catch(() => tampilkanToast('Gagal menyalin link'));
            } else {
                tampilkanToast('Browser tidak mendukung bagikan');
            }
        }

        function initLazyLoading() {
            if (!lazyObserver) {
                lazyObserver = new IntersectionObserver((entries, obs) => {
                    entries.forEach(e => {
                        if (!e.isIntersecting) return;
                        const img = e.target, src = img.dataset.src;
                        obs.unobserve(img);
                        if (!src) return;
                        img.onload  = () => img.classList.add('loaded');
                        img.onerror = () => { img.onerror = null; img.src = FOTO_ERROR; img.classList.add('loaded'); };
                        img.src = src;
                    });
                }, { rootMargin: '200px 0px' });
            }
            document.querySelectorAll('#katalog-container .lazy-img:not(.loaded)').forEach(img => {
                if (img.getAttribute('src').startsWith('data:')) lazyObserver.observe(img);
            });
        }

        /* ───────── Zoom & toast ───────── */

        let fokusSebelumZoom = null;
        function openZoom(src, alt) {
            const img = document.getElementById('img-zoom');
            img.onerror = () => { img.onerror = null; img.src = FOTO_ERROR; };
            img.src = src;
            img.alt = alt || 'Foto karpet';
            fokusSebelumZoom = document.activeElement;
            document.getElementById('modal-zoom').style.display = 'flex';
            document.body.style.overflow = 'hidden';
            document.getElementById('modal-close-btn').focus();
        }
        function closeZoom() {
            const modal = document.getElementById('modal-zoom');
            if (modal.style.display !== 'flex') return;
            modal.style.display = 'none';
            document.body.style.overflow = '';
            fokusSebelumZoom?.focus?.();
        }
        document.addEventListener('keydown', e => {
            if (e.key !== 'Escape') return;
            closeZoom();
            if (document.getElementById('filter-sheet').classList.contains('open')) tutupFilter();
        });

        function tampilkanToast(pesan) {
            let toast = document.getElementById('toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'toast';
                toast.setAttribute('role', 'status');
                toast.style.cssText = `
                    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
                    background:var(--text); color:#fff; padding:10px 18px;
                    border-radius:999px; font-size:14px; font-weight:500;
                    z-index:200; opacity:0; max-width:calc(100vw - 32px); text-align:center;
                    transition:opacity .25s ease, transform .25s ease; pointer-events:none;
                `;
                document.body.appendChild(toast);
            }
            toast.textContent = pesan;
            toast.offsetHeight; // paksa reflow agar transisi berjalan
            toast.style.opacity = '1';
            toast.style.transform = 'translateX(-50%) translateY(0)';
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(-50%) translateY(20px)';
            }, 2500);
        }

        // Desktop: scroll mouse di baris koleksi menggeser ke samping
        document.getElementById('filter-bar').addEventListener('wheel', e => {
            const bar = e.currentTarget;
            if (Math.abs(e.deltaY) > Math.abs(e.deltaX) && bar.scrollWidth > bar.clientWidth) {
                bar.scrollLeft += e.deltaY; e.preventDefault();
            }
        }, { passive: false });

        document.getElementById('search-input').addEventListener('input', debounce(cariProduk, 250));
        ambilData();
    </script>
